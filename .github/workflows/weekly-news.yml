# ============================================================
# 塗装業界ニュース自動まとめツール — GitHub Actions ワークフロー
# ============================================================
# 【テスト中】毎日 13:00 JST (04:00 UTC) に自動実行
# ※本番運用時は cron を '0 23 * * 0'（週1回）に戻すこと
# 手動実行も可能（workflow_dispatch）

name: Weekly Paint Industry News

on:
  # 定期実行: 毎日 13:00 JST = 04:00 UTC（テスト用）
  schedule:
    - cron: '0 4 * * *'

  # 手動実行（テスト用）
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ドライラン（ダミーデータ使用）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      skip_email:
        description: 'メール送信スキップ'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# 同時実行制御: 前回の実行が終わるまで待機
concurrency:
  group: weekly-news
  cancel-in-progress: false

# Node.js 24 への移行（警告対応）
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write

jobs:
  generate-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ────────────────────────
      # 1. チェックアウト
      # ────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ────────────────────────
      # 2. Python セットアップ
      # ────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ────────────────────────
      # 3. 依存パッケージインストール
      # ────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ────────────────────────
      # 4. パイプライン実行
      # ────────────────────────
      - name: Run news pipeline
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PAGES_BASE_URL: ${{ secrets.PAGES_BASE_URL }}
          LOG_LEVEL: INFO
        run: |
          # コマンドライン引数の構築
          ARGS=""

          # ドライラン判定
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          # メール送信スキップ判定
          if [ "${{ github.event.inputs.skip_email }}" = "true" ]; then
            ARGS="$ARGS --no-email"
          fi

          python -m scripts.main $ARGS

      # ────────────────────────
      # 5. 生成ファイルをコミット & プッシュ
      # ────────────────────────
      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # docs/ ディレクトリの変更をステージ
          git add docs/

          # 変更がある場合のみコミット
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            DATE=$(TZ='Asia/Tokyo' date +%Y-%m-%d)
            git commit -m "📰 Weekly news report: ${DATE}"
            git push
          fi

      # ────────────────────────
      # 6. 実行結果サマリー
      # ────────────────────────
      - name: Job summary
        if: always()
        run: |
          TRIGGER="${{ github.event_name }}"
          STATUS="${{ job.status }}"
          RUN_TIME=$(TZ='Asia/Tokyo' date '+%Y-%m-%d %H:%M:%S JST')

          echo "## 🎨 塗装業界ニュース — 実行結果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # 実行情報
          if [ "$TRIGGER" = "schedule" ]; then
            echo "| 項目 | 値 |" >> $GITHUB_STEP_SUMMARY
            echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
            echo "| トリガー | ⏰ スケジュール自動実行 |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 項目 | 値 |" >> $GITHUB_STEP_SUMMARY
            echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
            echo "| トリガー | 👤 手動実行 |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "| 実行時刻 | ${RUN_TIME} |" >> $GITHUB_STEP_SUMMARY

          if [ "$STATUS" = "success" ]; then
            echo "| ステータス | ✅ 成功 |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ステータス | ❌ 失敗 (${STATUS}) |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # レポートファイル情報
          if [ -d "docs" ]; then
            FILE_COUNT=$(ls docs/weekly-news-*.html 2>/dev/null | wc -l | tr -d ' ')
            echo "- 📄 累積レポート数: ${FILE_COUNT} 件" >> $GITHUB_STEP_SUMMARY

            LATEST=$(ls -t docs/weekly-news-*.html 2>/dev/null | head -1)
            if [ -n "$LATEST" ]; then
              echo "- 📝 最新レポート: \`$(basename $LATEST)\`" >> $GITHUB_STEP_SUMMARY
            fi
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # 失敗時の注意メッセージ
          if [ "$STATUS" != "success" ]; then
            echo "### ⚠️ エラー内容を確認してください" >> $GITHUB_STEP_SUMMARY
            echo "「Run news pipeline」ステップのログを確認してください。" >> $GITHUB_STEP_SUMMARY
          fi
